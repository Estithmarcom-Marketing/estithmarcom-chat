services:
  estithmarcom-chat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: staging

    container_name: estithmarcom-chat

    restart: unless-stopped

    networks:
      - backend_int

    expose:
      - "80"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  backend_int:
    external: true